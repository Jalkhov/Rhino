[workspace]
resolver = "3"
members = ["crates/rhino-core", "crates/rhino-app", "crates/rhino-db"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
codegen-units = 1
# A propósito sin `panic = "abort"`: el motor interpreta archivos hostiles, así
# que un pánico debe poder capturarse archivo por archivo (ver `scan::isolate`).
# Con `abort`, un solo archivo raro tumbaría el proceso entero.
strip = true
opt-level = "s"
