[package]
name = "rhino-app"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rhino-core = { path = "../rhino-core" }
# El acceso al sistema de accesibilidad (AccessKit en Windows, AT-SPI en Linux)
# va como dependencia opcional de Slint y sin esta función las propiedades
# `accessible-*` se compilan pero no llegan a ningún lector de pantalla.
slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
] }
# El selector nativo de archivos. En Linux el backend por defecto arrastra el
# cliente de Wayland entero, que aquí no hace falta (la ventana es winit/X11 y
# el producto es Windows): con `xdg-portal` a secas compila en el equipo de
# desarrollo y en i686-pc-windows-msvc usa los cuadros de diálogo de Windows.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
slint-build = "1"
